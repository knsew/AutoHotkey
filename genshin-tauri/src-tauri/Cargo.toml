[package]
name = "genshin-tauri"
version = "1.0.0"
description = "原神连招小助手 - Tauri 版启动器"
authors = ["KentJi"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
